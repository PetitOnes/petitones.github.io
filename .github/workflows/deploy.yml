name: Build, deploy, release by version
# main に push: Astro を build して GitHub Pages に出す。VERSION の名前(v0.1.0)のタグが無ければ タグ + Release も作る。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          V="$(tr -d ' \n' < VERSION)"; test -n "$V"
          P="$(node -p "require('./package.json').version")"
          test "$V" = "$P" || { echo "VERSION ($V) と package.json ($P) が違います"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
        id: ver
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - name: tag + release
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ steps.ver.outputs.version }}" }
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then echo "v$V はもうある"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$V"; git push origin "v$V"
          gh release create "v$V" --title "ぷちたち(サイト)v$V" --notes "https://petitones.github.io/ の版 v$V。"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
